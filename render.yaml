services:
  - type: web
    name: lumenmart
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: LUMEN MART
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:t8BE1zDRoYytg2LSIzMTZS2bD4gnNBE3/B2LgOQHgwc=
      - key: APP_LOCALE
        value: id
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/lumenmart.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
